<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1900 820" font-family="'Yu Gothic','Noto Sans JP',sans-serif" font-size="13">
<defs>
  <marker id="ah" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#475569"/></marker>
  <marker id="ah-r" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#dc2626"/></marker>
  <marker id="ah-g" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#16a34a"/></marker>
</defs>

<!-- グループ背景 -->
<rect x="30" y="80" width="520" height="280" rx="12" fill="rgba(59,130,246,0.06)" stroke="rgba(59,130,246,0.3)" stroke-width="1"/>
<text x="50" y="100" font-size="11" fill="rgba(59,130,246,0.7)" font-weight="700">開始</text>

<rect x="570" y="180" width="500" height="180" rx="12" fill="rgba(34,197,94,0.06)" stroke="rgba(34,197,94,0.3)" stroke-width="1"/>
<text x="590" y="200" font-size="11" fill="rgba(34,197,94,0.7)" font-weight="700">スキャン</text>

<rect x="1090" y="180" width="480" height="180" rx="12" fill="rgba(245,158,11,0.06)" stroke="rgba(245,158,11,0.3)" stroke-width="1"/>
<text x="1110" y="200" font-size="11" fill="rgba(245,158,11,0.7)" font-weight="700">会計・支払い</text>

<rect x="1590" y="200" width="160" height="140" rx="12" fill="rgba(168,85,247,0.06)" stroke="rgba(168,85,247,0.3)" stroke-width="1"/>
<text x="1610" y="220" font-size="11" fill="rgba(168,85,247,0.7)" font-weight="700">完了</text>

<rect x="380" y="440" width="900" height="340" rx="12" fill="rgba(220,38,38,0.04)" stroke="rgba(220,38,38,0.2)" stroke-width="1"/>
<text x="400" y="460" font-size="11" fill="rgba(220,38,38,0.6)" font-weight="700">モーダル</text>

<!-- ノード -->
<!-- S1 待受 -->
<rect x="60" y="240" width="130" height="44" rx="8" fill="#fff" stroke="#3b82f6" stroke-width="2"/>
<text x="90" y="258" font-size="10" fill="#64748b">S1</text>
<text x="90" y="274" font-weight="700" fill="#1e293b">待受</text>

<!-- S2 ポイントカード有無 -->
<rect x="240" y="240" width="180" height="44" rx="8" fill="#fff" stroke="#3b82f6" stroke-width="2"/>
<text x="270" y="258" font-size="10" fill="#64748b">S2</text>
<text x="270" y="274" font-weight="700" fill="#1e293b">ポイントカード有無</text>

<!-- S2b カード読み取り -->
<rect x="440" y="110" width="160" height="44" rx="8" fill="#fff" stroke="#3b82f6" stroke-width="2"/>
<text x="470" y="128" font-size="10" fill="#64748b">S2b</text>
<text x="470" y="144" font-weight="700" fill="#1e293b">カード読み取り</text>

<!-- S3 袋選択 -->
<rect x="620" y="240" width="130" height="44" rx="8" fill="#fff" stroke="#22c55e" stroke-width="2"/>
<text x="650" y="258" font-size="10" fill="#64748b">S3</text>
<text x="650" y="274" font-weight="700" fill="#1e293b">袋選択</text>

<!-- S4 スキャン -->
<rect x="830" y="240" width="130" height="44" rx="8" fill="#fff" stroke="#22c55e" stroke-width="2"/>
<text x="860" y="258" font-size="10" fill="#64748b">S4</text>
<text x="860" y="274" font-weight="700" fill="#1e293b">スキャン</text>

<!-- S5 確認 -->
<rect x="1100" y="240" width="130" height="44" rx="8" fill="#fff" stroke="#f59e0b" stroke-width="2"/>
<text x="1130" y="258" font-size="10" fill="#64748b">S5</text>
<text x="1130" y="274" font-weight="700" fill="#1e293b">確認</text>

<!-- S6 支払い -->
<rect x="1320" y="240" width="130" height="44" rx="8" fill="#fff" stroke="#f59e0b" stroke-width="2"/>
<text x="1350" y="258" font-size="10" fill="#64748b">S6</text>
<text x="1350" y="274" font-weight="700" fill="#1e293b">支払い</text>

<!-- S7 完了 -->
<rect x="1600" y="240" width="130" height="44" rx="8" fill="#fff" stroke="#a855f7" stroke-width="2"/>
<text x="1630" y="258" font-size="10" fill="#64748b">S7</text>
<text x="1630" y="274" font-weight="700" fill="#1e293b">完了</text>

<!-- M1 同じ商品確認 -->
<rect x="830" y="500" width="170" height="44" rx="8" fill="#fff" stroke="#dc2626" stroke-width="2"/>
<text x="860" y="518" font-size="10" fill="#64748b">M1</text>
<text x="860" y="534" font-weight="700" fill="#1e293b">同じ商品確認</text>

<!-- M2 店員呼出 -->
<rect x="1100" y="500" width="140" height="44" rx="8" fill="#fff" stroke="#dc2626" stroke-width="2"/>
<text x="1130" y="518" font-size="10" fill="#64748b">M2</text>
<text x="1130" y="534" font-weight="700" fill="#1e293b">店員呼出</text>

<!-- M3 年齢確認 -->
<rect x="620" y="500" width="140" height="44" rx="8" fill="#fff" stroke="#dc2626" stroke-width="2"/>
<text x="650" y="518" font-size="10" fill="#64748b">M3</text>
<text x="650" y="534" font-weight="700" fill="#1e293b">年齢確認</text>

<!-- M4 操作停止警告 -->
<rect x="420" y="500" width="160" height="44" rx="8" fill="#fff" stroke="#dc2626" stroke-width="2"/>
<text x="450" y="518" font-size="10" fill="#64748b">M4</text>
<text x="450" y="534" font-weight="700" fill="#1e293b">操作停止警告</text>

<!-- M5 取り消し確認 -->
<rect x="620" y="640" width="160" height="44" rx="8" fill="#fff" stroke="#dc2626" stroke-width="2"/>
<text x="650" y="658" font-size="10" fill="#64748b">M5</text>
<text x="650" y="674" font-weight="700" fill="#1e293b">取り消し確認</text>

<!-- === 矢印（メインフロー） === -->
<!-- S1→S2 -->
<line x1="190" y1="262" x2="238" y2="262" stroke="#475569" stroke-width="1.5" marker-end="url(#ah)"/>
<text x="200" y="254" font-size="10" fill="#475569">スタート</text>

<!-- S2→S2b (はい) -->
<path d="M330,240 C330,180 440,150 438,132" fill="none" stroke="#16a34a" stroke-width="1.5" marker-end="url(#ah-g)"/>
<text x="360" y="175" font-size="10" fill="#16a34a">はい</text>

<!-- S2→S3 (いいえ) -->
<line x1="420" y1="262" x2="618" y2="262" stroke="#dc2626" stroke-width="1.5" marker-end="url(#ah-r)"/>
<text x="490" y="254" font-size="10" fill="#dc2626">いいえ</text>

<!-- S2b→S3 (次へ/スキップ) -->
<path d="M600,140 C650,140 650,240 618,258" fill="none" stroke="#475569" stroke-width="1.5" marker-end="url(#ah)"/>
<text x="610" y="190" font-size="10" fill="#475569">次へ/スキップ</text>

<!-- S3→S4 -->
<line x1="750" y1="262" x2="828" y2="262" stroke="#475569" stroke-width="1.5" marker-end="url(#ah)"/>
<text x="765" y="254" font-size="10" fill="#475569">次へ</text>

<!-- S4→S5 -->
<line x1="960" y1="262" x2="1098" y2="262" stroke="#475569" stroke-width="1.5" marker-end="url(#ah)"/>
<text x="1000" y="254" font-size="10" fill="#475569">会計へ進む</text>

<!-- S5→S6 -->
<line x1="1230" y1="262" x2="1318" y2="262" stroke="#475569" stroke-width="1.5" marker-end="url(#ah)"/>
<text x="1250" y="254" font-size="10" fill="#475569">支払いへ</text>

<!-- S6→S7 -->
<line x1="1450" y1="262" x2="1598" y2="262" stroke="#16a34a" stroke-width="1.5" marker-end="url(#ah-g)"/>
<text x="1470" y="254" font-size="10" fill="#16a34a">決済完了</text>

<!-- S7→S1 (3秒後自動) -->
<path d="M1665,284 C1665,360 1700,380 1700,400 C1700,780 60,780 60,360 C60,310 60,284 62,284" fill="none" stroke="#a855f7" stroke-width="1.2" stroke-dasharray="4,3" marker-end="url(#ah)"/>
<text x="900" y="790" font-size="10" fill="#a855f7" text-anchor="middle">3秒後自動リセット</text>

<!-- S5→S4 (戻る) -->
<path d="M1100,278 C1060,300 990,300 962,278" fill="none" stroke="#64748b" stroke-width="1" stroke-dasharray="3,2" marker-end="url(#ah)"/>
<text x="1020" y="306" font-size="10" fill="#64748b">戻る</text>

<!-- S6→S5 (戻る) -->
<path d="M1320,278 C1280,300 1250,300 1232,278" fill="none" stroke="#64748b" stroke-width="1" stroke-dasharray="3,2" marker-end="url(#ah)"/>
<text x="1260" y="306" font-size="10" fill="#64748b">戻る</text>

<!-- === モーダル矢印 === -->
<!-- S4→M1 (重複) -->
<path d="M895,284 C895,380 900,470 900,498" fill="none" stroke="#dc2626" stroke-width="1.2" marker-end="url(#ah-r)"/>
<text x="905" y="400" font-size="9" fill="#dc2626">同じ商品</text>

<!-- M1→S4 (はい/いいえ) -->
<path d="M920,500 C920,420 930,310 928,286" fill="none" stroke="#16a34a" stroke-width="1" marker-end="url(#ah-g)"/>
<text x="930" y="420" font-size="9" fill="#16a34a">はい/いいえ</text>

<!-- S4→M3 (酒類) -->
<path d="M860,284 C820,380 720,470 700,498" fill="none" stroke="#dc2626" stroke-width="1.2" marker-end="url(#ah-r)"/>
<text x="760" y="400" font-size="9" fill="#dc2626">酒類スキャン</text>

<!-- M3→S4 (はい) -->
<path d="M740,500 C760,420 830,320 840,286" fill="none" stroke="#16a34a" stroke-width="1" marker-end="url(#ah-g)"/>
<text x="790" y="390" font-size="9" fill="#16a34a">はい(20歳以上)</text>

<!-- M3→M2 (いいえ) -->
<line x1="760" y1="522" x2="1098" y2="522" stroke="#dc2626" stroke-width="1" marker-end="url(#ah-r)"/>
<text x="880" y="515" font-size="9" fill="#dc2626">いいえ→店員呼出</text>

<!-- M2→S4 -->
<path d="M1170,500 C1100,400 980,320 950,286" fill="none" stroke="#16a34a" stroke-width="1" marker-end="url(#ah-g)"/>
<text x="1060" y="380" font-size="9" fill="#16a34a">閉じる/取消</text>

<!-- S4→M5 (取り消し) -->
<path d="M850,284 C800,400 730,580 720,638" fill="none" stroke="#dc2626" stroke-width="1.2" marker-end="url(#ah-r)"/>
<text x="750" y="580" font-size="9" fill="#dc2626">取り消し</text>

<!-- M5→S4 (いいえ) -->
<path d="M780,660 C850,600 870,400 880,286" fill="none" stroke="#16a34a" stroke-width="1" marker-end="url(#ah-g)"/>
<text x="840" y="600" font-size="9" fill="#16a34a">いいえ</text>

<!-- M5→S1 (はい、取り消す) -->
<path d="M620,662 C400,662 120,500 100,286" fill="none" stroke="#dc2626" stroke-width="1" stroke-dasharray="3,2" marker-end="url(#ah-r)"/>
<text x="300" y="650" font-size="9" fill="#dc2626">はい、取り消す→リセット</text>

<!-- M4→S1 (最初から) -->
<path d="M420,522 C300,522 150,400 110,286" fill="none" stroke="#dc2626" stroke-width="1" stroke-dasharray="3,2" marker-end="url(#ah-r)"/>
<text x="240" y="510" font-size="9" fill="#dc2626">最初から</text>

<!-- M4→S4 (続ける) -->
<path d="M560,500 C600,420 820,340 850,286" fill="none" stroke="#16a34a" stroke-width="1" marker-end="url(#ah-g)"/>
<text x="660" y="420" font-size="9" fill="#16a34a">続ける</text>

<!-- タイトル -->
<text x="950" y="40" text-anchor="middle" font-size="18" font-weight="700" fill="#1e293b">セルフレジ v4 — 画面遷移図</text>
<text x="950" y="62" text-anchor="middle" font-size="12" fill="#64748b">13画面 / 27遷移（ポイントカード先読み方式）</text>
</svg>
