<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 360" font-family="'Yu Gothic','Noto Sans JP',sans-serif" font-size="14">
<defs>
  <marker id="ah" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#2c3e6b"/></marker>
  <marker id="ah-back" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#64748b"/></marker>
</defs>

<!-- 背景帯 -->
<rect x="0" y="0" width="1400" height="360" rx="0" fill="#ffffff"/>

<!-- タイトル -->
<text x="700" y="36" text-anchor="middle" font-size="20" font-weight="700" fill="#1a365d">セルフレジ v4 — メインフロー（購入完了まで）</text>
<text x="700" y="58" text-anchor="middle" font-size="13" fill="#64748b">7画面 / 一直線＋分岐2箇所＋戻る2箇所</text>

<!-- ノード -->
<!-- S1 待受 -->
<rect x="40" y="140" width="120" height="60" rx="10" fill="#f0f9ff" stroke="#3b82f6" stroke-width="2.5"/>
<text x="100" y="163" text-anchor="middle" font-size="11" fill="#64748b">S1</text>
<text x="100" y="182" text-anchor="middle" font-size="15" font-weight="700" fill="#1e293b">待受</text>

<!-- S2 ポイントカード有無 -->
<rect x="220" y="140" width="160" height="60" rx="10" fill="#f0f9ff" stroke="#3b82f6" stroke-width="2.5"/>
<text x="300" y="163" text-anchor="middle" font-size="11" fill="#64748b">S2</text>
<text x="300" y="182" text-anchor="middle" font-size="14" font-weight="700" fill="#1e293b">ポイントカード有無</text>

<!-- S2b カード読み取り -->
<rect x="280" y="260" width="140" height="50" rx="10" fill="#f0f9ff" stroke="#3b82f6" stroke-width="1.5" stroke-dasharray="4,2"/>
<text x="350" y="282" text-anchor="middle" font-size="11" fill="#64748b">S2b</text>
<text x="350" y="298" text-anchor="middle" font-size="13" font-weight="700" fill="#1e293b">カード読み取り</text>

<!-- S3 袋選択 -->
<rect x="440" y="140" width="120" height="60" rx="10" fill="#f0fff4" stroke="#22c55e" stroke-width="2.5"/>
<text x="500" y="163" text-anchor="middle" font-size="11" fill="#64748b">S3</text>
<text x="500" y="182" text-anchor="middle" font-size="15" font-weight="700" fill="#1e293b">袋選択</text>

<!-- S4 スキャン -->
<rect x="620" y="140" width="120" height="60" rx="10" fill="#f0fff4" stroke="#22c55e" stroke-width="2.5"/>
<text x="680" y="163" text-anchor="middle" font-size="11" fill="#64748b">S4</text>
<text x="680" y="182" text-anchor="middle" font-size="15" font-weight="700" fill="#1e293b">スキャン</text>

<!-- S5 確認 -->
<rect x="800" y="140" width="120" height="60" rx="10" fill="#fffbeb" stroke="#f59e0b" stroke-width="2.5"/>
<text x="860" y="163" text-anchor="middle" font-size="11" fill="#64748b">S5</text>
<text x="860" y="182" text-anchor="middle" font-size="15" font-weight="700" fill="#1e293b">確認</text>

<!-- S6 支払い -->
<rect x="980" y="140" width="120" height="60" rx="10" fill="#fffbeb" stroke="#f59e0b" stroke-width="2.5"/>
<text x="1040" y="163" text-anchor="middle" font-size="11" fill="#64748b">S6</text>
<text x="1040" y="182" text-anchor="middle" font-size="15" font-weight="700" fill="#1e293b">支払い</text>

<!-- S7 完了 -->
<rect x="1160" y="140" width="120" height="60" rx="10" fill="#faf5ff" stroke="#a855f7" stroke-width="2.5"/>
<text x="1220" y="163" text-anchor="middle" font-size="11" fill="#64748b">S7</text>
<text x="1220" y="182" text-anchor="middle" font-size="15" font-weight="700" fill="#1e293b">完了</text>

<!-- 矢印（メインフロー） -->
<!-- S1→S2 -->
<line x1="160" y1="170" x2="218" y2="170" stroke="#2c3e6b" stroke-width="2" marker-end="url(#ah)"/>
<text x="180" y="160" font-size="11" fill="#2c3e6b">スタート</text>

<!-- S2→S3 (いいえ) -->
<line x1="380" y1="170" x2="438" y2="170" stroke="#2c3e6b" stroke-width="2" marker-end="url(#ah)"/>
<text x="395" y="160" font-size="11" fill="#2c3e6b">いいえ</text>

<!-- S2→S2b (はい) -->
<path d="M300,200 L300,220 L350,258" fill="none" stroke="#2c3e6b" stroke-width="1.5" marker-end="url(#ah)"/>
<text x="270" y="235" font-size="11" fill="#2c3e6b">はい</text>

<!-- S2b→S3 -->
<path d="M420,285 C460,285 480,200 438,180" fill="none" stroke="#2c3e6b" stroke-width="1.5" marker-end="url(#ah)"/>
<text x="445" y="250" font-size="11" fill="#2c3e6b">次へ</text>

<!-- S3→S4 -->
<line x1="560" y1="170" x2="618" y2="170" stroke="#2c3e6b" stroke-width="2" marker-end="url(#ah)"/>
<text x="575" y="160" font-size="11" fill="#2c3e6b">次へ</text>

<!-- S4→S5 -->
<line x1="740" y1="170" x2="798" y2="170" stroke="#2c3e6b" stroke-width="2" marker-end="url(#ah)"/>
<text x="745" y="160" font-size="11" fill="#2c3e6b">会計へ</text>

<!-- S5→S6 -->
<line x1="920" y1="170" x2="978" y2="170" stroke="#2c3e6b" stroke-width="2" marker-end="url(#ah)"/>
<text x="930" y="160" font-size="11" fill="#2c3e6b">支払いへ</text>

<!-- S6→S7 -->
<line x1="1100" y1="170" x2="1158" y2="170" stroke="#2c3e6b" stroke-width="2" marker-end="url(#ah)"/>
<text x="1105" y="160" font-size="11" fill="#2c3e6b">決済完了</text>

<!-- S7→S1 (自動) -->
<path d="M1220,200 C1220,320 100,320 100,202" fill="none" stroke="#a855f7" stroke-width="1.2" stroke-dasharray="5,3" marker-end="url(#ah-back)"/>
<text x="660" y="338" text-anchor="middle" font-size="11" fill="#a855f7">3秒後に自動で戻る</text>

<!-- S5→S4 (戻る) -->
<path d="M800,190 C780,210 760,210 742,190" fill="none" stroke="#64748b" stroke-width="1.2" stroke-dasharray="3,2" marker-end="url(#ah-back)"/>
<text x="765" y="218" font-size="10" fill="#64748b">戻る</text>

<!-- S6→S5 (戻る) -->
<path d="M980,190 C960,210 940,210 922,190" fill="none" stroke="#64748b" stroke-width="1.2" stroke-dasharray="3,2" marker-end="url(#ah-back)"/>
<text x="945" y="218" font-size="10" fill="#64748b">戻る</text>

<!-- 凡例 -->
<rect x="40" y="80" width="12" height="12" rx="2" fill="none" stroke="#3b82f6" stroke-width="2"/>
<text x="58" y="91" font-size="11" fill="#64748b">開始</text>
<rect x="110" y="80" width="12" height="12" rx="2" fill="none" stroke="#22c55e" stroke-width="2"/>
<text x="128" y="91" font-size="11" fill="#64748b">スキャン</text>
<rect x="200" y="80" width="12" height="12" rx="2" fill="none" stroke="#f59e0b" stroke-width="2"/>
<text x="218" y="91" font-size="11" fill="#64748b">会計</text>
<rect x="270" y="80" width="12" height="12" rx="2" fill="none" stroke="#a855f7" stroke-width="2"/>
<text x="288" y="91" font-size="11" fill="#64748b">完了</text>
<line x1="340" y1="86" x2="370" y2="86" stroke="#64748b" stroke-width="1.2" stroke-dasharray="3,2"/>
<text x="376" y="91" font-size="11" fill="#64748b">戻る/自動</text>
</svg>
